name: build-workflow-telemetry

on:
  pull_request:
    branches:
      - "master"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@v6
      - name: Workflow Telemetry
        uses: ./
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run all
      - name: Verify no unstage changes
        run: tests/verify-no-unstaged-changes.sh
