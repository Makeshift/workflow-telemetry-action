---
name: Copilot Setup Steps

'on':
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    environment: >-
      ${{ (github.event_name == 'push' ||
      github.event_name == 'pull_request') && 'copilot' || '' }}
    runs-on: ubuntu-latest

    permissions:
      deployments: read
      contents: write
      id-token: write
      actions: read
      checks: read
      statuses: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install
